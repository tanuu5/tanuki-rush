<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TANUKI RUSH - model test</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd0ff; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; }
    canvas { display: block; }
    #ui {
      position: fixed; top: 10px; left: 10px; width: 272px; padding: 10px 12px;
      background: rgba(18, 28, 40, 0.78); color: #f4f7fb; border-radius: 10px; font-size: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.25); user-select: none;
    }
    #ui h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: 0.06em; }
    #states { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 8px; }
    #states button {
      padding: 5px 0; border: 0; border-radius: 6px; background: #33485e; color: #fff; font-size: 11px; cursor: pointer;
    }
    #states button.on { background: #ff8a1c; color: #1b1208; font-weight: 700; }
    .row { display: flex; align-items: center; gap: 6px; margin: 5px 0; }
    .row label { width: 58px; flex: none; }
    .row input[type=range] { flex: 1; }
    .row .val { width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 8px; margin: 6px 0; }
    .views { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
    .views button { flex: 1; padding: 4px 0; border: 0; border-radius: 5px; background: #2a3b4d; color: #dfe8f2; font-size: 11px; cursor: pointer; }
    #help { margin-top: 6px; color: #9fb3c8; font-size: 10.5px; line-height: 1.45; }
    #stats { margin-top: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #bfe6ff; white-space: pre; }
    select { background: #2a3b4d; color: #fff; border: 0; border-radius: 4px; }
    /* other game modules may be mid-edit; keep Vite's global error overlay off this test page */
    vite-error-overlay { display: none !important; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>TANUKI RUSH - model test</h1>
    <div id="states"></div>
    <div class="row"><label>speed</label><input id="speed" type="range" min="0" max="80" step="0.5" value="0" /><span class="val" id="speedV">0</span></div>
    <div class="row"><label>steer</label><input id="steer" type="range" min="-1" max="1" step="0.01" value="0" /><span class="val" id="steerV">0</span></div>
    <div class="row"><label>time</label><input id="tscale" type="range" min="0" max="2" step="0.05" value="1" /><span class="val" id="tscaleV">1</span></div>
    <div class="checks">
      <label><input id="boost" type="checkbox" /> boost</label>
      <label><input id="airborne" type="checkbox" /> airborne</label>
      <label><input id="chase" type="checkbox" /> chase cam</label>
      <label><input id="turntable" type="checkbox" /> turntable</label>
      <label><input id="pause" type="checkbox" /> pause</label>
      <label><input id="scroll" type="checkbox" checked /> scroll ground</label>
      <label><input id="pole" type="checkbox" /> 1.3 m pole</label>
    </div>
    <div class="row"><label>tonemap</label>
      <select id="tonemap">
        <option value="aces" selected>ACES Filmic (game)</option>
        <option value="none">None</option>
        <option value="agx">AgX</option>
      </select>
    </div>
    <div class="views">
      <button data-view="front">front</button>
      <button data-view="three">3/4</button>
      <button data-view="side">side</button>
      <button data-view="back">back</button>
      <button data-view="face">face</button>
    </div>
    <div id="stats"></div>
    <div id="help">keys: 1-9,0,- states / C chase / B boost / space pause<br />drag = orbit, wheel = zoom</div>
  </div>
  <script type="module" src="./model-test.js"></script>
</body>
</html>
